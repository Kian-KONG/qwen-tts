name: Deploy GitHub Pages

on:
  push:
    branches: [qwen-tts]
  workflow_dispatch:

# Official Pages API cannot create the site from GITHUB_TOKEN on this repo
# (Resource not accessible by integration). Publish to the gh-pages branch instead.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        env:
          GITHUB_PAGES: "1"
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://tts.efforttracking.online' }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
        run: |
          echo "VITE_API_BASE=${VITE_API_BASE}"
          npm ci
          npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTS 配音</title>
    <script>
      try {
        var t = localStorage.getItem("qwen-tts-theme");
        var dark = t === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
      try {
        var loc = localStorage.getItem("qwen-tts-locale");
        if (loc !== "zh" && loc !== "en") {
          loc = String(navigator.language || "zh").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
        }
        document.documentElement.lang = loc === "en" ? "en" : "zh-CN";
        document.title = loc === "en" ? "TTS Studio" : "TTS 配音";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
